name: Zemanta
description: Zemanta was a native advertising and content-recommendation technology company founded in 2007
  (Ljubljana, Slovenia and New York), best known for Zemanta One, a self-serve programmatic demand-side
  platform (DSP) for native advertising. Zemanta was acquired by Outbrain in 2017 and its DSP has since been
  folded into the Outbrain / Teads advertising platform. The standalone one.zemanta.com console now redirects
  to dsp.outbrain.com and the former developers.zemanta.com API documentation is no longer resolvable, so
  there is no live first-party Zemanta public API surface today. This profile is retained in the API
  Evangelist network as a venture-portfolio lead with domain-level metadata.
