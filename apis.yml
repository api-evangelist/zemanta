name: Zemanta
description: >-
  Zemanta is a native advertising and content-recommendation technology company founded in 2007
  (Ljubljana, Slovenia and New York), best known for Zemanta One, a self-serve programmatic demand-side
  platform (DSP) for native advertising. Outbrain acquired Zemanta in 2017 and the DSP now trades as Teads
  DSP. The product line survived both the acquisition and the rebrand, and its API is live — the Teads DSP
  REST Campaign Management API, the former Zemanta One API, is still served from Zemanta-owned hosts, with
  the API endpoint at https://oneapi.zemanta.com/rest/v1 and a complete public reference at
  https://dev.zemanta.com/one/api/. The API covers accounts, credits, campaigns, budgets, goals, ad groups,
  ads, creatives, video assets, bid modifiers, measurement services, conversion definitions, audiences,
  publisher groups, deals, keyword lists, reporting and real-time statistics. Authentication is two-legged
  OAuth 2.0 client credentials; access is granted through a sales relationship rather than self-service
  sign-up. The console host one.zemanta.com 301-redirects every path to the matching path on
  dsp.outbrain.com.
