apis:
- aid: zemanta:teads-dsp-api
  name: Teads DSP API (Zemanta One)
  description: >-
    The Teads DSP REST Campaign Management API, formerly the Zemanta One API. It lets Teads DSP
    clients programmatically create and manage accounts, campaigns, budgets, campaign goals, ad groups, ad
    group sources, ads, creatives, video assets, bid modifiers, measurement services, conversion definitions,
    audiences, publisher groups, publisher blacklists, deals and keyword lists, and pull custom performance
    reports and real-time statistics. Two-legged OAuth 2.0 client credentials, JSON payloads wrapped in a
    data envelope, marker-offset pagination and a 30 request-per-second per-user rate limit.
  humanURL: https://dev.zemanta.com/one/api/
  baseURL: https://oneapi.zemanta.com/rest/v1
