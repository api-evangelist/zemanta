id_conventions:
  prefixes: none
  format: >-
    Entity identifiers are opaque numeric-string ids exposed as `id` in the payload and as
    typed path parameters (accountId, campaignId, adGroupId, adId, creativeId, ...).
    The provider publishes no id-prefix scheme.

reference_data:
  note: >-
    The reference publishes a large "Constants reference" section enumerating the closed
    vocabularies used by these entities — currency, campaign type, delivery status, IAB
    content categories, language, device/environment/OS/browser/connection/channel
    targeting, ad positions and placement types, display ad sizes, video playback method,
    player size, rewarded and skippability options, geo targeting types (DMA, country,
    region, city, postal code), day/hour, creative types, batch statuses, audit statuses,
    DMP type, conversion window and attribution model types.
  source: https://dev.zemanta.com/one/api/
